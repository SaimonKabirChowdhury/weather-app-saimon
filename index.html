<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather app (saimon)</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#0f172a,#155e75 55%,#0d9488);color:#fff;text-align:center;padding:24px}
main{width:min(100%,460px);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:24px;padding:32px 24px;box-shadow:0 18px 50px #00182755;backdrop-filter:blur(12px)}
h1{font-size:2rem;margin:0 0 12px}p{line-height:1.5}.controls{display:flex;gap:8px;margin-top:24px}input{min-width:0;flex:1;border:0;border-radius:10px;padding:13px;font-size:1rem}button{border:0;border-radius:10px;background:#2dd4bf;color:#083344;padding:12px 16px;font-weight:700;cursor:pointer}button:hover{background:#5eead4}button:disabled{opacity:.65;cursor:wait}#result{margin-top:22px}#result h2{margin-bottom:4px}.temp{font-size:3rem;font-weight:800;margin:8px 0}.error{color:#fecaca}footer{font-size:.8rem;margin-top:24px;color:#cbd5e1}@media(max-width:380px){.controls{flex-direction:column}}
</style>
</head>
<body><main><h1>🌦️ Weather app (saimon)</h1><p>Enter any city to see its current weather.</p><form id="weatherForm" class="controls"><input id="cityInput" type="text" placeholder="Enter city name..." aria-label="City name" required><button id="submit" type="submit">Get Weather</button></form><div id="result" aria-live="polite"></div><footer>Weather data from Open-Meteo</footer></main>
<script>
const form=document.getElementById('weatherForm'),result=document.getElementById('result'),button=document.getElementById('submit');
const codes={0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',51:'Light drizzle',53:'Drizzle',55:'Dense drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Light rain showers',81:'Rain showers',82:'Heavy rain showers',95:'Thunderstorm',96:'Thunderstorm with hail',99:'Thunderstorm with heavy hail'};
form.addEventListener('submit',async e=>{e.preventDefault();const city=document.getElementById('cityInput').value.trim();if(!city)return;button.disabled=true;result.textContent='Loading...';try{
const geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=en&format=json');if(!geo.ok)throw Error('Location service unavailable');const locations=await geo.json();if(!locations.results?.length)throw Error('City not found');const loc=locations.results[0];
const response=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+loc.latitude+'&longitude='+loc.longitude+'&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m');if(!response.ok)throw Error('Weather service unavailable');const data=await response.json();const w=data.current;result.replaceChildren();
const heading=document.createElement('h2');heading.textContent=loc.name+', '+loc.country;const temp=document.createElement('p');temp.className='temp';temp.textContent=Math.round(w.temperature_2m)+'°C';const desc=document.createElement('p');desc.textContent=codes[w.weather_code]||'Current conditions';const details=document.createElement('p');details.textContent='Humidity: '+w.relative_humidity_2m+'% · Wind: '+w.wind_speed_10m+' km/h';result.append(heading,temp,desc,details);
}catch(err){result.textContent=err.message||'Unable to load weather';result.className='error';}finally{button.disabled=false;}});
</script></body></html>
